services:
  comfy-ui:
    build:
      context: ../Dockerfile
      dockerfile: Dockerfile
    image: comfy-ui:v0.19.0
    container_name: comfy-ui
    volumes:
      # --- Stable Diffusion系 ---
      - ../models/Illustrious/Checkpoint:/ComfyUI/models/checkpoints:ro
      - ../models/Illustrious/LoRA:/ComfyUI/models/loras/Illustrious:ro
      # --- Anima ---
      - ../models/Anima/diffusion_models:/ComfyUI/models/diffusion_models:ro
      - ../models/Anima/text_encoders:/ComfyUI/models/text_encoders:ro
      - ../models/Anima/vae:/ComfyUI/models/vae:ro
      - ../models/Anima/loras:/ComfyUI/models/loras/anima:ro
      # --- Shared upscalers / bundled workflows ---
      - ../models/upscale_models:/ComfyUI/models/upscale_models:ro
      # --- Danbooru tagger model cache / bundled workflows ---
      - ../models/wd14_tagger:/ComfyUI/custom_nodes/ComfyUI-WD14-Tagger/models
      - ../workflows:/ComfyUI/user/default/workflows/repository:ro
      # --- Qwen Image系 ---
      # - ../models/Qwen-Image:/ComfyUI/models
      # --- wan2.2系 ---
      # - ../models/wan2.2/wan2.2_ti2v_5B:/ComfyUI/models
      # --- 出力 ---
      - ../output:/ComfyUI/output
    ports:
      - "8188:8188"
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
