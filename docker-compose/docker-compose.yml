# Manager なし（まっさら）構成。
# Manager を有効にする差分は docker-compose.override.yml 側にあり、
#   docker compose up -d --build                        # Manager あり（override が自動適用・既定）
#   docker compose -f docker-compose.yml up -d --build  # まっさら（このファイル単独）
# のように使い分ける。
name: comfy-ui

services:
  comfy-ui:
    build:
      context: ../Dockerfile
      dockerfile: Dockerfile
    # Manager 同梱イメージ（master の comfy-ui:v0.19.0 とはタグで区別する）。
    # まっさら / Manager あり のどちらも同じイメージを使い、実行時に切り替える。
    image: comfy-ui:v0.19.0-manager
    container_name: comfy-ui
    environment:
      # 0 = Manager 無効。override 側で "1" に上書きされる。
      COMFYUI_ENABLE_MANAGER: "0"
    volumes:
      # --- Stable Diffusion系 ---
      - ../models/Illustrious/Checkpoint:/ComfyUI/models/checkpoints
      - ../models/Illustrious/LoRA:/ComfyUI/models/loras
      # --- Qwen Image系 ---
      # - ../models/Qwen-Image:/ComfyUI/models
      # --- wan2.2系 ---
      # - ../models/wan2.2/wan2.2_ti2v_5B:/ComfyUI/models
      # --- 出力 ---
      - ../output:/ComfyUI/output
    ports:
      - "8188:8188"
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
